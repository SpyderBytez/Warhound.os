<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130d"><title>WARHOUND.OS</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#dceadd;background:#07130d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#193923,#07130d 60%);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}header{padding:20px 16px 12px;border-bottom:1px solid #36533a;display:flex;justify-content:space-between;align-items:center}.brand{color:#a7f08e;font-weight:900;letter-spacing:2px}.sub{font-size:10px;letter-spacing:2px;color:#799b7c}.badge{font-size:10px;color:#9df28d;border:1px solid #437b46;border-radius:30px;padding:6px 9px}main{max-width:700px;margin:auto;padding:18px 14px 110px}h1{font-size:21px;letter-spacing:2px;margin:5px 0}h2{font-size:16px;color:#a8f395;letter-spacing:1px}p{line-height:1.55}.muted{color:#91a897;font-size:13px}.panel{background:#102218;border:1px solid #33533b;border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px #0003}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:#203b27;color:#c9f6bd;border:1px solid #497f4e;border-radius:9px;padding:11px 12px}.btn:active{background:#3b6941}.btn.primary{background:#8bd878;color:#07130d;font-weight:800}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:15px;text-align:left;min-height:100px;background:#132a1b;border:1px solid #33583d;border-radius:12px;color:#d9f1d7}.tile b{display:block;color:#a5f291;font-size:12px;letter-spacing:1px;margin:10px 0 5px}.tile span{font-size:11px;color:#91ad96}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#09180f;border-top:1px solid #39573d;padding:8px 0 max(9px,env(safe-area-inset-bottom));z-index:10}nav button{background:none;border:0;color:#8db294;font-size:10px;min-width:57px;padding:5px}nav button.active{color:#a9f68d}nav button strong{display:block;font-size:19px;margin-bottom:3px}.chat{height:350px;overflow:auto;padding:10px;background:#0a1910;border:1px solid #2e4933;border-radius:10px}.bubble{max-width:88%;padding:10px 12px;border-radius:11px;margin:9px 0;line-height:1.45;font-size:14px;white-space:pre-wrap}.kh{background:#213d29;border-left:3px solid #9beb83}.sp{background:#263b40;border-right:3px solid #78d7c6;margin-left:auto}.who{font-size:10px;letter-spacing:1px;opacity:.7;margin-bottom:4px}.compose{display:flex;gap:7px;margin-top:9px}.compose input{flex:1;min-width:0;background:#0c1d12;color:white;border:1px solid #426246;border-radius:9px;padding:12px}.choice{width:100%;text-align:left;margin:5px 0}.pill{display:inline-block;border:1px solid #50754e;border-radius:30px;padding:5px 9px;color:#a6e6a0;font-size:11px;margin:3px}.hidden{display:none}.stat{font-size:25px;font-weight:900;color:#b4f49e}.progress{height:9px;background:#27412c;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#9cdd87}textarea{width:100%;background:#0a1910;color:#e0f2dc;border:1px solid #45634a;border-radius:8px;padding:12px;min-height:90px}.room{padding:13px;border-bottom:1px solid #2f4e36}.room:last-child{border:0}footer{font-size:10px;color:#6e8d74;text-align:center;margin:20px 0} .glow{color:#b1f69b}
</style></head><body><header><div><div class="brand">▣ WARHOUND.OS</div><div class="sub">BARGHEST // PRIVATE TERMINAL</div></div><div class="badge">● ENCRYPTED</div></header><main id="app"></main><nav id="nav"></nav><script>
const KEY='warhound-os-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch{S={}};S={trust:12,points:0,orders:0,completed:[],messages:[{from:'kh',text:'Private line is open. Use it when you need something, Spyder.'}],notes:'',unlocks:[],...S};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));let tab='home';const $=x=>document.getElementById(x);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=()=>{let h=new Date().getHours();return h<6?'Private quarters — intermittent availability':h<10?'Morning briefings — Black Sapphire':h<13?'Security command — operations review':h<17?'Dogtown administration — meetings':h<21?'Logistics and negotiations — occupied':'Black Sapphire — late command review'};const tabs=[['home','⌂','HOME'],['comms','▤','COMMS'],['orders','▣','ORDERS'],['sapphire','◇','SAPPHIRE'],['more','☷','MORE']];function go(t){tab=t;render()}function render(){let a=$('app');$('nav').innerHTML=tabs.map(([t,i,n])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><strong>${i}</strong>${n}</button>`).join('');a.innerHTML=({home,comms,orders,sapphire,more,companion,breach,files,settings})[tab]();if(tab==='comms'){let c=$('chat');c.scrollTop=c.scrollHeight}}function home(){return `<div class="sub">AUTHORIZED USER // SPYDER</div><h1>WELCOME BACK, PUP.</h1><p class="muted">A secure little corner of Dogtown. Fictional transmissions and activity are simulated locally on this device.</p><div class="panel"><div class="line"><div><div class="sub">COL. KURT HANSEN</div><h2 style="margin:7px 0">${status()}</h2><div class="muted">Private channel: authorized</div></div><div class="stat">K.H.</div></div><p class="muted">“I trust you've found something useful to do with that terminal.”</p><button class="btn primary" onclick="go('comms')">OPEN PRIVATE COMMS →</button></div><div class="grid">${[['orders','▣','COLONEL’S ORDERS','Assignments and reports'],['companion','♡','HANSEN DIRECTIVE','A little attention'],['sapphire','◇','BLACK SAPPHIRE','Your rooms and routines'],['breach','⌘','BREACH PROTOCOL','Unlock classified intel'],['files','▤','PERSONNEL FILES','Records and privileges'],['more','☷','MORE SYSTEMS','All modules']].map(([t,i,n,d])=>`<button class="tile" onclick="go('${t}')">${i}<b>${n}</b><span>${d}</span></button>`).join('')}</div>`}const responses=[['miss','Been a long day? Finish what you need to finish. Then come find me, pup.'],['bored','Then make yourself useful. I have no shortage of problems that need solving.'],['love','Careful, prince. You keep talking like that, I might start expecting you to mean it.'],['sir','That got my attention. Go on.'],['work','Do the job properly. I want you back in one piece, not a heroic casualty.'],['sleep','Get some rest. Whatever it is can wait until morning. That’s an order.'],['hi','There you are. What’s on your mind, kid?'],['good','Good work. I knew you could handle it.'],['sorry','Save the apology. Tell me what happened, and what you intend to do about it.']];function reply(m){let l=m.toLowerCase();let hit=responses.find(([k])=>l.includes(k));return hit?hit[1]:['I’m listening.','You’ve got my attention, Spyder.','Noted. And what do you intend to do about it?','You have a remarkable talent for finding ways to occupy my time.','Go on, pup.','If this is another one of your schemes, I want the details before it becomes my problem.'][Math.floor(Math.random()*6)]}function send(){let i=$('msg'),m=i.value.trim();if(!m)return;S.messages.push({from:'sp',text:m},{from:'kh',text:reply(m)});S.trust=Math.min(100,S.trust+1);save();render()}function comms(){return `<div class="sub">CHANNEL 01 // EYES ONLY</div><h1>COMMAND LINE</h1><p class="muted">COL. HANSEN · ${status()} · Scripted simulation, not live AI</p><div class="chat" id="chat">${S.messages.map(m=>`<div class="bubble ${m.from}"><div class="who">${m.from==='kh'?'KURT HANSEN':'SPYDER'}</div>${esc(m.text)}</div>`).join('')}</div><div class="compose"><input id="msg" placeholder="Transmit a message…" onkeydown="if(event.key==='Enter')send()"><button class="btn primary" onclick="send()">SEND</button></div><p class="muted">Messages are stored locally on this device. Kurt's replies use prewritten lines and keywords.</p>`}const tasks=[['Operational readiness','Check your gear, devices, and anything you need for the next few hours.'],['Field intelligence','Notice three details in your surroundings you usually overlook.'],['After-action report','Write down one thing you handled well today.'],['Hydration order','Drink some water. The Colonel has no use for a dehydrated netrunner.'],['Systems maintenance','Take five minutes to stretch your hands, shoulders, or neck.'],['Recon assignment','Invent a new Dogtown operation and give it a codename.'],['Communications discipline','Put one unfinished thought into words, however messy.']];function orders(){let idx=new Date().getDate()%tasks.length;let [name,desc]=tasks[idx],done=S.completed.includes(new Date().toDateString());return `<div class="sub">OPERATIONS // DAILY BRIEFING</div><h1>COLONEL’S ORDERS</h1><div class="panel"><div class="sub">TODAY'S ASSIGNMENT</div><h2>${name}</h2><p>${desc}</p><p class="muted">“Nothing dramatic. Just do the job properly.”</p><button class="btn primary" ${done?'disabled':''} onclick="complete()">${done?'✓ REPORT ACCEPTED':'SUBMIT COMPLETION REPORT'}</button></div><div class="panel"><div class="line"><div><div class="sub">COMPLETED ORDERS</div><div class="stat">${S.orders}</div></div><div><div class="sub">REWARD CREDITS</div><div class="stat">${S.points}</div></div></div></div>`}function complete(){let d=new Date().toDateString();if(S.completed.includes(d))return;S.completed.push(d);S.orders++;S.points+=15;S.trust=Math.min(100,S.trust+3);S.messages.push({from:'kh',text:'Report received. Good work, pup.'});save();render()}function sapphire(){return `<div class="sub">PRIVATE RESIDENCE // BLACK SAPPHIRE</div><h1>YOUR PLACE IN DOGTOWN</h1><p class="muted">A fictional interactive home map. Choose a room to uncover a small moment.</p><div class="panel">${[['office','Kurt’s office','Operations, reports, and the chair you keep stealing.'],['nest','Your gaming nest','Blankets, cables, fidgets, snacks, and a suspiciously expensive setup.'],['balcony','The balcony','Dogtown lights below. A rare quiet corner above the noise.'],['quarters','Private quarters','The place where neither of you needs to perform for anyone.']].map(([id,n,d])=>`<div class="room"><div class="line"><div><b>${n}</b><div class="muted">${d}</div></div><button class="btn" onclick="room('${id}')">VISIT</button></div></div>`).join('')}</div><div id="roomresult"></div>`}function room(id){let x={office:'Kurt glances up from a logistics report. “If you’re staying, pull up a chair. And don’t touch the shipment figures.”',nest:'Your cables are neatly routed now. You didn’t do that. Someone had the outlets replaced, too.',balcony:'The city hums below. Through the open door, Kurt’s voice carries from a business call, low and controlled.',quarters:'A folded black jacket waits on the chair. Kurt has left the bedside light on.'};$('roomresult').innerHTML=`<div class="panel"><div class="sub">PRIVATE MOMENT</div><p>${x[id]}</p></div>`}const moods=[['attention','Need attention','“I’ve got a few minutes. Come here, pup.”'],['restless','Restless','“Pick one thing. Finish it. Then you can come bother me.”'],['comfort','Need some quiet','“You don’t have to explain it. Sit down. Stay awhile.”'],['brat','Feeling bratty','“You done testing the limits of my patience, or should I clear my schedule?”'],['praise','Need praise','“You’ve been doing good work. Don’t think I haven’t noticed.”'],['miss','Missing him','“I know, kid. I’ll be back when I can.”']];function companion(){return `<div class="sub">HANSEN DIRECTIVE // PRIVATE ACCESS</div><h1>WHAT DO YOU NEED, PUP?</h1><div class="grid">${moods.map(([id,n])=>`<button class="tile" onclick="mood('${id}')"><b>${n.toUpperCase()}</b><span>Request response</span></button>`).join('')}</div><div id="moodresult"></div>`}function mood(id){let x=moods.find(x=>x[0]===id);$('moodresult').innerHTML=`<div class="panel"><div class="sub">K.H. // PRIVATE TRANSMISSION</div><p>${x[2]}</p><button class="btn" onclick="S.messages.push({from:'kh',text:${JSON.stringify(x[2])}});save();go('comms')">SAVE TO COMMS</button></div>`}const secrets=[['01','SECURITY MEMO','Special operative Spyder retains cross-border movement authorization at Colonel Hansen’s discretion.'],['02','SUPPLY REQUISITION','Replacement components for Spyder’s personal workstation approved without standard procurement review.'],['03','PRIVATE NOTE','Kurt keeps a spare charging cable in his office. He has never acknowledged why.'],['04','COMMAND EXCEPTION','A complaint concerning Spyder’s unconventional approach to protocol was closed by direct command.']];function breach(){let n=S.unlocks.length;return `<div class="sub">ENCRYPTED ARCHIVE // SECURITY CHALLENGE</div><h1>BREACH PROTOCOL</h1><div class="panel"><p class="muted">Decode a simple sequence to retrieve fictional classified records. Each successful breach costs no credits.</p><div class="line"><span>FILES DECRYPTED</span><b class="glow">${n}/${secrets.length}</b></div><div class="progress"><div style="width:${n/secrets.length*100}%"></div></div><br><button class="btn primary" onclick="challenge()" ${n>=secrets.length?'disabled':''}>${n>=secrets.length?'ARCHIVE COMPLETE':'INITIATE BREACH'}</button></div><div id="challenge"></div>${S.unlocks.map(i=>`<div class="panel"><div class="sub">FILE ${secrets[i][0]} // ${secrets[i][1]}</div><p>${secrets[i][2]}</p></div>`).join('')}`}let answer=0;function challenge(){let a=Math.floor(Math.random()*5)+2,b=Math.floor(Math.random()*5)+2;answer=a+b;$('challenge').innerHTML=`<div class="panel"><h2>SECURITY HANDSHAKE</h2><p>Complete the access checksum: <b>${a} + ${b} = ?</b></p><div class="compose"><input type="number" id="checksum" placeholder="Checksum"><button class="btn" onclick="verify()">DECRYPT</button></div></div>`}function verify(){if(Number($('checksum').value)!==answer){$('challenge').insertAdjacentHTML('beforeend','<p class="muted">ACCESS DENIED — incorrect checksum.</p>');return}let n=secrets.findIndex((_,i)=>!S.unlocks.includes(i));if(n>=0){S.unlocks.push(n);S.points+=5;save()}render()}function files(){return `<div class="sub">BARGHEST // PERSONNEL SYSTEM</div><h1>SPYDER // SPECIAL ASSET</h1><div class="panel"><span class="pill">NETRUNNER</span><span class="pill">INFILTRATION</span><span class="pill">SPECIAL ACCESS</span><p><b>Command:</b> Colonel Kurt Hansen<br><b>Deployment:</b> Dogtown / Night City<br><b>Standing:</b> Unconventional operative; high operational autonomy</p><div class="sub">TRUST PROGRESSION (GAME MECHANIC)</div><div class="line"><span>COMMAND CONFIDENCE</span><b>${S.trust}/100</b></div><div class="progress"><div style="width:${S.trust}%"></div></div><p class="muted">Earn points by completing assignments and interacting with comms.</p></div><div class="panel"><h2>PERSONAL FIELD NOTES</h2><textarea id="notes" placeholder="Add your own Spyder lore, mission ideas, or private notes…">${esc(S.notes)}</textarea><button class="btn primary" onclick="S.notes=$('notes').value;save();alert('Saved on this device')">SAVE NOTES</button></div>`}function more(){return `<div class="sub">SYSTEM DIRECTORY</div><h1>ADDITIONAL MODULES</h1><div class="grid">${[['companion','♡','HANSEN DIRECTIVE','Mood-based responses'],['breach','⌘','BREACH PROTOCOL','Decrypt classified files'],['files','▤','PERSONNEL FILES','Trust and personal notes'],['settings','⚙','SYSTEM SETTINGS','Backup and privacy']].map(([t,i,n,d])=>`<button class="tile" onclick="go('${t}')">${i}<b>${n}</b><span>${d}</span></button>`).join('')}</div>`}function settings(){return `<div class="sub">LOCAL DEVICE // CONFIGURATION</div><h1>SYSTEM SETTINGS</h1><div class="panel"><h2>YOUR DATA</h2><p class="muted">Progress is stored in this browser. It will not automatically sync between phones or browsers. Back it up before clearing browser data.</p><button class="btn" onclick="backup()">EXPORT SAVE FILE</button> <label class="btn" style="display:inline-block">IMPORT SAVE <input type="file" accept="application/json" style="display:none" onchange="restore(this)"></label></div><div class="panel"><h2>ABOUT</h2><p class="muted">WARHOUND.OS v1.0 · A fictional fan-made offline companion inspired by Cyberpunk 2077: Phantom Liberty. Not affiliated with CD PROJEKT RED. No real messages or AI connection.</p></div>`}function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='warhound-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.messages)||!Array.isArray(v.completed)||!Array.isArray(v.unlocks))throw Error('Invalid save');S=v;save();render();alert('Save imported')}catch{alert('Invalid save file')}})}render();</script></body></html>
