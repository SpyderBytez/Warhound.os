// Times are simulation minutes from midnight on day one.
const shifts = [

];
const locations = {
  office: ['Command office','The freight map has been pinned through three older sets of gate times.', 'Compare the manifests', 'manifest', 'Both refrigerated trucks carry the same seal number. The duplicate is on your deck.'],

// Choice fields are label, operational consequence, follow-up, stat changes and optional evidence.
const operations = [
  {name:'Cold Chain', brief:'The clinic signed for two cases of insulin. Three left the motor pool. Recover the missing case before the reefer shuts down.', choices:[
    ['Hold the trucks at the gate','Clinic stock recovered. The freight queue backs up to the stadium.','I have the medicine and six drivers billing me for the wait. Next time give the gate a lane to keep open.',{trust:2,rep:1}],

  {name:'Dead Air', brief:'A stolen watch radio is keying the convoy frequency. Someone is studying how fast our patrols answer.', choices:[

const clock = m => 'D'+(Math.floor(m/1440)+1)+' · '+String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const shift = m => shifts.filter(x=>x[0]<=Math.floor(m/60)%24).at(-1);
function nextWatch(m){return Math.floor(m/1440)*1440+(shifts.find(x=>x[0]*60>m%1440)?.[0]??24)*60}
function availableAt(m){while(!shift(m)[2])m=nextWatch(m);return m}
const clamp = n => Math.max(0,Math.min(100,n));
function adjust(changes){for(const [k,v] of Object.entries(changes))S[k]=clamp(S[k]+v)}
function line(from,text,time=now()){S.messages.push({from,text,time})}
function dispatch(text,time=now()){S.pending.push({kind:'notice',text,due:availableAt(time)})}
function answerLine(raw,m){
  const s=raw.toLowerCase(),last=S.reports.at(-1), active=operations[S.active], prev=S.thread;
  if(/remember |remind me /.test(s)&&!s.includes('what')){S.memo=raw.replace(/^.*?(?:remember|remind me)\s+/i,'').slice(0,350);return 'I’ve put “'+S.memo+'” in the margin of my shift book.'}
  if(/remember|remind|margin|shift book/.test(s))return S.memo?'My shift book says “'+S.memo+'.” Still your call what you do with it.':'My shift book is open. Tell me what to remember.';
  if(/report|outcome|last job|driver|broker|medicine/.test(s)&&last){S.thread='report';return last.name+'. '+last.result+' '+(prev==='report'?'The signed copy is in Orders. My captains work from that copy.':'That’s the version I’m taking into briefing.')}
  if(/job|orders|brief|work|mission|priority/.test(s)){S.thread='work';return active?active.brief+' You have discretion on the approach.':S.reports.length<operations.length?'I left a packet in Orders. Read it before you offer me a solution.':'All three packets are closed. Check the duty log when the watch changes.'}
  if(/privilege|clearance|access/.test(s))return S.access?'I signed the dispatch drawer over to you. The clean approaches in your reports are why.':'Your border pass still stands. Preserve a source in the field and I’ll consider dispatch clearance.';
  if(/trust|standing|reputation/.test(s))return S.rep>=4?'The watch captain knows your signature now. '+(S.trust>=15?'If you need a gate held, use my name.':'If you want my name on a requisition, show me the cost first.'):'I read the returns. Give the watch something it can use and the captains will remember you.';
  if(/schedule|where|busy|available/.test(s))return shift(m)[1]+'. '+(shift(m)[3]==='quarters'?'Use the side door.':'I’m up at the Sapphire.')+' Next handover is '+clock(nextWatch(m))+'.';
  if(/maelstrom|dum.dum/.test(s))return 'Your contact can keep his invitation. If Dum-Dum has something to sell, bring me a price before you bring him across my border.';
  if(/quiet|comfort|miss|attention|love|tired|sleep|restless|praise|brat/.test(s)){
    S.thread='private';const day=Math.floor(m/1440);if(S.contactDay!==day){adjust({affection:1});S.contactDay=day}
    if(/praise/.test(s)&&last)return last.result+' I read your signature at the bottom, kid. I know who did the work.';
    if(S.affection>=14 && prev==='private')return 'Your chair’s where you left it, prince. I can finish these returns with you here.';
    if(shift(m)[3]==='quarters')return S.flags.lamp?'Saw the light you left on. Come in, pup. I’ve kept the far side of the bench clear.':'Latch is off, pup. There’s coffee on my side if you’re staying.';
    return prev==='private'?'I can give you the chair by my desk, kid. I still have a border to run.':'Come upstairs when you like, pup. I’ll leave the side office open. You can shut the door on the noise.';
  }
  if(/why|what next|tell me more|how come/.test(s))return prev==='report'&&last?last.follow:prev==='work'&&active?active.choices[0][0]+' is within your authority. The cleaner alternatives take groundwork.':prev==='private'?'Because you asked for room, kid. You can have it.':'Tell me which decision you want explained. The report, the assignment, or my schedule?';
  if(/^(hi|hey|evening|morning|sir)[!. ]*$/i.test(s))return last?'There you are. I’ve been reading your '+last.name+' return.':'Line’s yours, Spyder. I’ve got the watch sheet in front of me.';
  if(prev==='clarify'){S.thread='';return 'I’ll keep your wording on the record. If you want a decision from me, tie it to the job or tell me what you need from me personally.'}
  S.thread='clarify';return '“'+raw.slice(0,95)+'”'+(active?' — does that change your approach to '+active.name+'?':' — is that for the duty log, or between us?');
}

const tasks=[['Operational readiness','Check your gear, devices, and anything you need for the next few hours.'],['Field intelligence','Notice three details in your surroundings you usually overlook.'],['After-action report','Write down one thing you handled well today.'],['Hydration order','Drink some water. The Colonel has no use for a dehydrated netrunner.'],['Systems maintenance','Take five minutes to stretch your hands, shoulders, or neck.'],['Recon assignment','Invent a new Dogtown operation and give it a codename.'],['Communications discipline','Put one unfinished thought into words, however messy.']];
const secrets=[['01','SECURITY MEMO','Special operative Spyder retains cross-border movement authorization at Colonel Hansen’s discretion.'],['02','SUPPLY REQUISITION','Replacement components for Spyder’s personal workstation approved without standard procurement review.'],['03','PRIVATE NOTE','Kurt keeps a spare charging cable in his office. He has never acknowledged why.'],['04','COMMAND EXCEPTION','A complaint concerning Spyder’s unconventional approach to protocol was closed by direct command.']];function breach(){let n=S.unlocks.length;return `<div class="sub">ENCRYPTED ARCHIVE // SECURITY CHALLENGE</div><h1>BREACH PROTOCOL</h1><div class="panel"><p class="muted">Decode a simple sequence to retrieve fictional classified records. Each successful breach costs no credits.</p><div class="line"><span>FILES DECRYPTED</span><b class="glow">${n}/${secrets.length}</b></div><div class="progress"><div style="width:${n/secrets.length*100}%"></div></div><br><button class="btn primary" onclick="challenge()" ${n>=secrets.length?'disabled':''}>${n>=secrets.length?'ARCHIVE COMPLETE':'INITIATE BREACH'}</button></div><div id="challenge"></div>${S.unlocks.map(i=>`<div class="panel"><div class="sub">FILE ${secrets[i][0]} // ${secrets[i][1]}</div><p>${secrets[i][2]}</p></div>`).join('')}`}let answer=0;function challenge(){let a=Math.floor(Math.random()*5)+2,b=Math.floor(Math.random()*5)+2;answer=a+b;$('challenge').innerHTML=`<div class="panel"><h2>SECURITY HANDSHAKE</h2><p>Complete the access checksum: <b>${a} + ${b} = ?</b></p><div class="compose"><input type="number" id="checksum" placeholder="Checksum"><button class="btn" onclick="verify()">DECRYPT</button></div></div>`}function verify(){if(Number($('checksum').value)!==answer){$('challenge').insertAdjacentHTML('beforeend','<p class="muted">ACCESS DENIED — incorrect checksum.</p>');return}let n=secrets.findIndex((_,i)=>!S.unlocks.includes(i));if(n>=0){S.unlocks.push(n);S.points+=5;save()}render()}function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='warhound-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script><script>
'use strict';
const KEY='warhound-os-v1', $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readSave(v={}){
  if(!v || typeof v!=='object'||Array.isArray(v)) throw Error('Invalid save');
  const data={trust:12,rep:0,access:0,affection:10,points:0,orders:0,completed:[],unlocks:[],messages:[{from:'kh',text:'I’ve got my phone on me, kid. How’s your day going?'}],notes:'',anchor:Date.now(),base:600,pace:4,pending:[],flags:{},room:'office',active:null,reports:[],events:{},journal:[],quick:[],photo:'',thread:'',memo:'',contactDay:-1,...v};
  for(const k of ['completed','unlocks','messages','pending','reports','journal','quick'])if(!Array.isArray(data[k]))throw Error('Invalid '+k);
  for(const k of ['trust','rep','access','affection','points','orders','anchor','base','pace'])if(!Number.isSafeInteger(data[k])||data[k]<0)throw Error('Invalid '+k);
  for(const k of ['events','flags'])if(!data[k]||typeof data[k]!=='object'||Array.isArray(data[k]))throw Error('Invalid '+k);
  if(![1,4,12].includes(data.pace)||!(Object.hasOwn(locations,data.room))||data.active!==null&&(!Number.isInteger(data.active)||!operations[data.active]))throw Error('Invalid shift');
  if(data.messages.some(x=>!x||!['kh','sp'].includes(x.from)||typeof x.text!=='string')||data.unlocks.some(i=>!Number.isInteger(i)||!secrets[i])||data.pending.some(x=>!x||!Number.isSafeInteger(x.due)||!['notice','chat'].includes(x.kind)||typeof x.text!=='string'))throw Error('Invalid record');
  if(data.reports.some(x=>!x||!operations.some(op=>op.name===x.name)||typeof x.result!=='string')||data.journal.some(x=>!x||typeof x.text!=='string')||data.quick.some(x=>typeof x!=='string'))throw Error('Invalid archive');
  if(typeof data.photo!=='string'||(data.photo&&!/^data:image\/jpeg;base64,[a-zA-Z0-9+/=]+$/.test(data.photo)))throw Error('Invalid photo');
  return data;
}
let S;try{S=readSave(JSON.parse(localStorage.getItem(KEY))||{})}catch{S=readSave();alert('Could not load the saved terminal. Export any backup before continuing.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch{alert('Browser storage is full or unavailable. Export your current save in Settings.');return false}}
const now=()=>S.base+Math.floor(Math.max(0,Date.now()-S.anchor)/60000*S.pace);
let tab='comms',draft='', lastMinute=-1;
const tabs=[['home','⌂','HOME'],['comms','▤','TEXTS'],['orders','▣','ORDERS'],['sapphire','◇','SAPPHIRE'],['more','☷','MORE']];
const title=(sub,name)=>'<div class="sub">'+sub+'</div><h1>'+name+'</h1>';
const panel=(name,content)=>'<section class="panel"><h2>'+name+'</h2>'+content+'</section>';
const btn=(label,action,primary=false)=>'<button class="btn '+(primary?'primary':'')+'" onclick="'+action+'">'+label+'</button>';

const grid=items=>'<div class="grid">'+items.map(a=>tile(...a)).join('')+'</div>';
function go(t){tab=t;render();window.scrollTo(0,0);$('app').focus({preventScroll:true})}
function render(){
  const m=now();if(flush(m))save();lastMinute=m;
  $('nav').innerHTML=tabs.map(([t,i,n])=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')"><strong>'+i+'</strong>'+n+'</button>').join('');
  $('app').innerHTML=({home,comms,orders,sapphire,more,companion,breach,files,settings})[tab]();
  if(tab==='comms'){$('chat').scrollTop=$('chat').scrollHeight;$('msg').value=draft}
}
function duty(){let m=now(),w=shift(m);return '<div class="sub">DOGTOWN // '+clock(m)+'</div><h2>'+w[1]+'</h2><p>'+w[4]+'</p><p class="muted">'+(w[2]?'Private line open':'Transmissions held until '+clock(availableAt(m)))+'</p>'}
function waitWatch(){S.base=nextWatch(now());S.anchor=Date.now();flush(now());save();render()}
function home(){return title('AUTHORIZED USER // SPYDER','WELCOME BACK, PUP.')+'<section class="panel">'+duty()+btn('OPEN PRIVATE COMMS →',"go('comms')",true)+'</section>'+grid([['orders','▣','COLONEL’S ORDERS',operations[S.active]?.name||'Dispatch & after-action reports'],['companion','♡','HANSEN DIRECTIVE','Private requests'],['sapphire','◇','BLACK SAPPHIRE',locations[S.room][0]],['breach','⌘','BREACH PROTOCOL','Decrypt classified intel'],['files','▤','PERSONNEL FILES','Standing & field journal'],['settings','⚙','SYSTEM SETTINGS','Clock, backup & conversation']])}
let attachment='', loadingImage=false;
const imageOK=s=>typeof s==='string' && /^data:image\/jpeg;base64,[a-zA-Z0-9+/=]+$/.test(s);
async function attach(f){
  if(!f)return;

  try{
    const img=await createImageBitmap(f), scale=Math.min(1,1280/Math.max(img.width,img.height)), c=document.createElement('canvas');

}

  return '<div class="sub">PRIVATE LINE</div><h1>Kurt Hansen</h1><p class="muted" id="presence">'+presence()+'</p><div class="chat" id="chat" role="log">'+S.messages.map(bubble).join('')+'</div>'+

  const text=raw?.trim().slice(0,6000)||'';if(loadingImage||(!text&&!attachment))return;
  const t=now();flush(t);const index=S.messages.length;
  S.messages.push({from:'sp',text,time:t,...(attachment?{image:attachment}:{})});

const subjects=[
  ['vent',/frustrat|annoy|whin|piss|mad\b|angry|sick of|hate|fuck this|vent|overwhelm|irritat/i,
    ['Go ahead, kid. You can say the ugly version to me.','Yeah, I’d be short on patience too. What happened after that?','I’m still here, pup. You can finish.']],
  ['social',/tik\s?tok|followers?|went viral|views|popular|likes\b/i,
    ['How many people are we talking, exactly? I know that tone. You’ve been waiting to tell somebody the number.','That many strangers stopped scrolling for something you made. You’re entitled to be a little smug, kid.','Which part are people quoting back at you? That’s usually the tell.']],
  ['made',/i made|made this|i built|i drew|i painted|my edit|finished making|look what|created|my drawing/i,
    ['Let me see it, kid. Which part took you the longest to get right?','I like hearing you talk through your own work. What did you change from the first version?','Keep a copy of this version before you start tinkering again. I know you.']],
  ['shift',/at work|at my job|coworker|boss|my shift|beet|break room/i,
    ['I’ve got a minute between calls. What’s going on over there?','Did you get a break in the end, or are you texting me between trips?','All right, I’m caught up. Go on, kid.']],
  ['good',/excited|so happy|proud|finally did|good news/i,
    ['There’s a message worth putting my coffee down for. Tell me.','Enjoy that one, prince. You earned the right to tell it twice.']],
  ['tired',/exhaust|tired|worn out|long day/i,
    ['Long one, huh. I’m at my desk awhile yet. Keep me company if you feel like it.','You can give me the short version, pup. I’ll be here when you have the rest.']]
];
function personalReply(items,t){
  const text=items.map(x=>x.text).join(' '),hasPic=items.some(x=>imageOK(S.messages[x.index]?.image));
  const topic=subjects.find(x=>x[1].test(text));
  let prior=subjects.find(x=>x[0]===S.lastSubject);
  if(/remember|mission|operation|report|schedule|miss you|love you/i.test(text))return answerLine(text,t);
  if(hasPic&&!text.trim())return 'Got the picture, kid. What caught your eye?';
  if(hasPic&&topic?.[0]==='made'){S.lastSubject='made';return 'There it is. Which bit did you keep going back to? You always have one.'}
  if(topic||prior&&S.topicTurns<2){
    let [id,,lines]=topic||prior;
    S.topicTurns=topic?0:(S.topicTurns||0)+1;S.lastSubject=id;
    S.replyCounts??={};const n=S.replyCounts[id]||0;S.replyCounts[id]=n+1;
    if(id==='social'&&/\d/.test(text)){const number=text.match(/\b\d[\d,.]*\s?[kKmM]?\b/)?.[0];if(number)return number.trim()+'? Christ, kid. All right, you get to brag. Which post was it?'}
    return lines[n%lines.length];
  }
  if(/^(hey|hi|sir|hello)[!. ]*$/i.test(text))return 'Hey, kid. What’s happening on your end?';
  if(/thank|lol|lmao|😂/.test(text)&&text.length<25)return 'There he is.';
  S.smallTalk=(S.smallTalk||0)+1;
  return ['You’ve got me for a bit. Tell me the rest.','Hang on, kid. Which part of that stuck with you?','I’ve put the paperwork down. Go on.'][(S.smallTalk-1)%3];
}
function checkIn(t){
  if(!Number.isFinite(S.nextHello)){S.nextHello=t+480;return true}
  if(t<S.nextHello||S.pending.length||!shift(t)[2]||S.messages.at(-1)?.checkIn)return false;
  const options=['Finally got the office to myself. What have you been up to, kid?','Someone moved the spare chair back to the conference room. Had it brought up again. How’s your day?','I’ve heard four men explain one missing truck. I’d rather hear what you’ve been doing.'];
  const topical={social:'Did that post of yours keep climbing, prince?',made:'How’d that piece you were working on turn out?',vent:'How’d the rest of your day go, kid?',shift:'You off shift yet, pup?'};
  const text=topical[S.lastSubject]||options[(S.helloCount||0)%options.length];
  S.messages.push({from:'kh',text,time:t,checkIn:true});S.helloCount=(S.helloCount||0)+1;S.nextHello=t+720;return true;
}
function flush(m){
  let changed=false;
  while(S.pending.length){
    const first=S.pending[0];if(first.due>m||first.after>Date.now())break;
    if(first.kind==='notice'){S.pending.shift();line('kh',first.text,first.due);changed=true;continue}
    let count=0;
    while(count<S.pending.length){const x=S.pending[count];if(x.kind!=='chat'||x.due>m||!!x.ai!==!!first.ai)break;count++}
    const items=S.pending.slice(0,count);
    if(first.ai&&modelConfig){if(!modelBusy)modelReply(items,m);break}
    S.nextHello=m+480;S.pending.splice(0,count);line('kh',personalReply(items,first.due),first.due);changed=true;
  }
  return checkIn(m)||changed;
}
async function modelReply(items,t){
  modelBusy=true;const cfg=modelConfig,state=S,first=items[0];
  const stop=items.at(-1).index+1;
  const history=S.messages.slice(0,stop).slice(-24).map(x=>({role:x.from==='kh'?'assistant':'user',content:imageOK(x.image)?[{type:'text',text:x.text||'A picture from my day.'},{type:'image_url',image_url:{url:x.image}}]:x.text}));
  const system='You are Kurt Hansen privately texting Spyder (he/him), your longtime partner in an alternate Dogtown. Reply only as Kurt in 1–4 conversational sentences. He can tell you about his real work, TikTok, things he creates or ordinary frustrations. Engage the specific detail he cares about. Let him vent, boast or share a photo without converting it into advice, a work assignment or an interrogation. When shown a picture, react to something actually visible. You are a shrewd commander with dry humor, comfortable silence and earned warmth. Call him kid, pup or prince occasionally. Give your own day some texture. Do not write his response. Your schedule: '+shift(t)[1]+'.';
  let reply;
  try{const r=await fetch(cfg.url,{method:'POST',credentials:'omit',redirect:'error',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(45000),headers:{'Content-Type':'application/json',...(cfg.key?{Authorization:'Bearer '+cfg.key}:{})},body:JSON.stringify({model:cfg.model,messages:[{role:'system',content:system},...history]})});
    if(!r.ok)throw Error();reply=(await r.json()).choices?.[0]?.message?.content;if(typeof reply!=='string'||!reply.trim())throw Error()
  }catch{if(S===state)reply=personalReply(items,t);if(S===state)alert('The model could not answer. Using offline dialogue for this reply.')}
  finally{modelBusy=false;if(S===state&&S.pending[0]===first){S.pending.splice(0,items.length);line('kh',reply.trim().slice(0,12000),t);save();refreshThread()}}
}
function refreshThread(){
  if(tab!=='comms')return;
  const chat=$('chat'),nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<90;
  chat.innerHTML=S.messages.map(bubble).join('');if(nearBottom)chat.scrollTop=chat.scrollHeight;
  $('receipt').textContent=S.pending.some(x=>x.kind==='chat')?'Delivered · waiting for Kurt':'';
  $('presence').textContent=presence();
}
function companion(){return title('HANSEN DIRECTIVE // PRIVATE ACCESS','PRIVATE REQUESTS')+panel('Direct line','<p>Choose a transmission for Kurt’s private channel.</p>'+['I could use some quiet.','I miss you.','Restless tonight, sir.','What did you think of my last report?'].map((s,i)=>'<button class="btn choice" onclick="transmit(this.textContent)">'+s+'</button>').join(''))}
function accept(i){if(S.active!==null||i!==S.reports.length||!operations[i])return;S.active=i;save();render()}
function resolveOp(i,c){const op=operations[i],choice=op?.choices[c];if(S.active!==i||!choice||choice[4]&&!S.flags[choice[4]])return;
  const [label,result,follow,stats]=choice,t=now();adjust(stats);S.points+=15;S.orders++;S.reports.push({name:op.name,label,result,follow,time:t});S.active=null;dispatch(follow,t);save();render()}
function daily(){let d=new Date().toDateString();if(S.completed.includes(d))return;S.completed.push(d);S.orders++;S.points+=15;save();render()}
function orders(){let i=S.active??S.reports.length,op=operations[i],task=tasks[new Date().getDate()%tasks.length];
  return title('OPERATIONS // DISPATCH','COLONEL’S ORDERS')+(op?panel(op.name,'<p>'+op.brief+'</p>'+(S.active===null?btn('Take the job','accept('+i+')',true):op.choices.map(([label,,,,key],c)=>'<button class="btn choice" '+(key&&!S.flags[key]?'disabled':'')+' onclick="resolveOp('+i+','+c+')">'+label+(key&&!S.flags[key]?'<small>Requires fieldwork · '+Object.values(locations).find(r=>r[3]===key)[0]+'</small>':'')+'</button>').join(''))):panel('Dispatch clear','All three packets have been filed. Watch duties continue at the Sapphire.'))+S.reports.slice().reverse().map(r=>panel(esc(r.name)+' · Mission report','<div class="sub">'+clock(r.time)+'</div><p>'+esc(r.label)+'</p><p>'+esc(r.result)+'</p>')).join('')+panel('Daily routine · '+task[0],'<p>'+task[1]+'</p>'+(S.completed.includes(new Date().toDateString())?'✓ Filed':btn('File routine report','daily()'))+'<p class="muted">'+S.orders+' reports · '+S.points+' credits</p>')}
const watches=['Night watch','Roll call','Gate audit','Visitor register','Freight handover','Evening returns'];
const dutyNotes=['A relief guard catches the last lift home.','The watch list reaches the gate before the first convoy.','Dispatch clears a mismatch on the east gate.','A visitor badge is returned to the correct escort.','The outgoing driver signs before the platform empties.','The command copy reaches the night desk.'];
function watchKey(){return Math.floor(now()/1440)+'-'+shifts.indexOf(shift(now()))}
function visit(room){if(!Object.hasOwn(locations,room))return;S.room=room;save();render()}
function inspect(){const key=locations[S.room][3];if(!S.flags[key]){S.flags[key]=true;if(key==='lamp')adjust({affection:2});save()}render()}
function fileWatch(){const w=shift(now()),key=watchKey(),idx=shifts.indexOf(w);if(S.room!==w[3]||S.events[key])return;S.events[key]=dutyNotes[idx];adjust({rep:1});save();render()}
function sapphire(){const r=locations[S.room],w=shift(now()),i=shifts.indexOf(w),key=watchKey();
  return title('PRIVATE RESIDENCE // BLACK SAPPHIRE','YOUR PLACE IN DOGTOWN')+'<div class="panel line">'+Object.entries(locations).map(([id,x])=>btn(x[0],"visit('"+id+"')",S.room===id)).join('')+'</div>'+panel(r[0],'<p>'+r[1]+'</p>'+(S.flags[r[3]]?'<p class="glow">'+r[4]+'</p>':btn(r[2],'inspect()'))+(S.room==='nest'&&S.photo?'<img class="photo" src="'+S.photo+'" alt="Your pinned photograph">':'')+(S.room==='office'&&S.access>0?'<p class="glow">Dispatch drawer unlocked · '+(operations[S.reports.length]?.brief||'Your signed reports are with the watch captain.')+'</p>':''))+
  panel(watches[i],'<div class="sub">'+clock(now())+' // '+locations[w[3]][0].toUpperCase()+'</div><p>'+w[4]+'</p>'+(S.events[key]?esc(S.events[key]):S.room===w[3]?btn('Countersign the duty log','fileWatch()'):btn('Visit duty station',"visit('"+w[3]+"')"))+'<p>'+btn('Wait until '+clock(nextWatch(now())),'waitWatch()')+'</p>')+
  (Object.keys(S.events).length?panel('Watch ledger',Object.entries(S.events).slice(-5).reverse().map(([k,v])=>'<p>D'+(Number(k.split('-')[0])+1)+' · '+esc(v)+'</p>').join('')):'')}
function more(){return title('SYSTEM DIRECTORY','ADDITIONAL MODULES')+grid([['companion','♡','HANSEN DIRECTIVE','Private requests'],['breach','⌘','BREACH PROTOCOL','Classified files'],['files','▤','PERSONNEL FILES','Standing & personal archive'],['settings','⚙','SYSTEM SETTINGS','Backup & personalization']])}
function addEntry(){let text=$('entry').value.trim();if(text){S.journal.push({text,time:now()});save();render()}}
function files(){return title('BARGHEST // PERSONNEL SYSTEM','SPYDER // SPECIAL ASSET')+panel('Command standing',[['Trust',S.trust],['Operational reputation',S.rep],['Affection',S.affection]].map(([n,v])=>'<div class="line"><span>'+n+'</span><b>'+v+'/100</b></div><div class="progress"><div style="width:'+v+'%"></div></div>').join('<br>')+'<p>Privileges · Cross-border movement'+(S.access?' · Dispatch drawer':'')+'</p><p class="muted">Private contact carries its own weight. Command records how you handle people, supplies and sources.</p>')+panel('Field notebook','<textarea id="notes" aria-label="Field notes">'+esc(S.notes)+'</textarea>'+btn('Save notes',"S.notes=$('notes').value;save();render()"))+panel('Lore archive','<textarea id="entry" maxlength="4000" aria-label="New lore entry" placeholder="Record an entry…"></textarea>'+btn('File entry','addEntry()')+S.journal.slice().reverse().map(x=>'<div class="record"><small>'+clock(x.time)+'</small><p>'+esc(x.text)+'</p></div>').join(''))}
function setPace(n){S.base=now();S.anchor=Date.now();S.pace=Number(n);save();render()}
function addQuick(){let s=$('quick').value.trim();if(s&&!S.quick.includes(s)){S.quick.push(s);save();render()}}
async function photo(f){if(!f)return;try{let im=await createImageBitmap(f),ratio=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,im.width*ratio);cv.height=Math.max(1,im.height*ratio);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);im.close();S.photo=cv.toDataURL('image/jpeg',0.72);save();render()}catch{alert('Choose a readable image file.')}}
async function restore(input){try{const v=JSON.parse(await input.files[0].text());if(!Array.isArray(v.messages)||!Array.isArray(v.completed)||!Array.isArray(v.unlocks))throw Error();const restored=readSave(v);S=restored;draft='';save();render()}catch{alert('Invalid save file.')}}
function settings(){return title('LOCAL DEVICE // CONFIGURATION','SYSTEM SETTINGS')+panel('Shift clock','<label>Simulation minutes per real minute <select onchange="setPace(this.value)">'+[1,4,12].map(n=>'<option '+(n===S.pace?'selected':'')+'>'+n+'</option>').join('')+'</select></label><p class="muted">Time advances while the terminal is closed.</p>')+panel('Personal effects','<label>Pin a photo in the gaming nest <input type="file" accept="image/*" onchange="photo(this.files[0])"></label>'+(S.photo?btn('Remove photo',"S.photo=\'\';save();render()"):'')+'<label>Custom transmission <input id="quick" maxlength="180"></label>'+btn('Save transmission','addQuick()')+S.quick.map((s,i)=>'<div class="record">'+esc(s)+' '+btn('Remove','S.quick.splice('+i+',1);save();render()')+'</div>').join(''))+aiSettings()+panel('Device backup','<p>Export your history, photos, orders and settings before clearing browser storage.</p>'+btn('EXPORT SAVE','backup()')+'<label>Import save <input type="file" accept="application/json" onchange="restore(this)"></label>')+'<footer>WARHOUND.OS // Fan-made alternate continuity · Cyberpunk 2077: Phantom Liberty</footer>'}
// Inference credentials live in memory only. Each model request is initiated in Comms.
let modelConfig=null,modelBusy=false;
function aiSettings(){return panel('Optional AI conversation','<p class="muted">Connect an OpenAI-compatible chat completions endpoint for this session. While connected, Send shares up to 24 recent messages and their photos with your provider. Choose a model that can read pictures. It must allow browser requests.</p><label>Chat completions URL <input id="endpoint" type="url" placeholder="https://…/v1/chat/completions"></label><label>Model ID <input id="model" autocomplete="off"></label><label>API key (if required) <input id="token" type="password" autocomplete="off"></label>'+btn('Use for this session','configureModel()')+(modelConfig?' '+btn('Disconnect','modelConfig=null;render()'):'')+'<p class="muted">'+(modelConfig?'Configured · '+esc(modelConfig.model):'Offline dialogue active')+'</p>')}
function configureModel(){try{let url=new URL($('endpoint').value);if(url.protocol!=='https:'&&!(url.protocol==='http:'&&['localhost','127.0.0.1','[::1]'].includes(url.hostname)))throw Error();let model=$('model').value.trim();if(!model||url.username||url.password)throw Error();modelConfig={url:url.href,model,key:$('token').value.trim()};render()}catch{alert('Enter an HTTPS endpoint (or localhost) and a model ID.')}}
window.addEventListener('storage',event=>{
  if(event.key!==KEY||!event.newValue)return;
  try{S=readSave(JSON.parse(event.newValue));render()}catch{}
});
if(!localStorage.getItem(KEY))save();
render();
setInterval(()=>{
  const m=now(),changed=flush(m);if(changed)save();
  if(tab==='comms'){
    if(changed||lastMinute!==m)refreshThread();
    lastMinute=m;
  }else if(lastMinute!==m&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
    if(['home','sapphire'].includes(tab))render();else lastMinute=m;
  }
},1000);

</script></body></html>
